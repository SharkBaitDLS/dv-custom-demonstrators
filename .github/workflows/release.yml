name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows]

    env:
      ReferencePath: 'C:\Program Files (x86)\Steam\steamapps\common\Derail Valley\DerailValley_Data\Managed\'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Pull LFS files
        run: git lfs pull

      - name: Classify tag
        id: tag
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Host "Tag '$tag' is a full release."
            "candidate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Tag '$tag' is a release candidate."
            "candidate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Verify tag matches info.json and repository.json versions
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $candidate = '${{ steps.tag.outputs.candidate }}' -eq 'true'
          $tag = '${{ github.ref_name }}' -replace '^v', ''
          $info = Get-Content -Raw info.json | ConvertFrom-Json
          $errors = @()

          if ($info.Version -ne $tag) {
            $errors += "info.json Version is '$($info.Version)', expected '$tag'."
          }

          $release = (Get-Content -Raw repository.json | ConvertFrom-Json).Releases |
            Where-Object { $_.Id -eq $info.Id }
          if (-not $release) {
            $errors += "repository.json has no Releases entry with Id '$($info.Id)'."
          } else {
            if ($release.Version -ne $tag) {
              $errors += "repository.json Version is '$($release.Version)', expected '$tag'."
            }
            $expectedUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/$($info.Id).zip"
            if ($release.DownloadUrl -ne $expectedUrl) {
              $errors += "repository.json DownloadUrl is '$($release.DownloadUrl)', expected '$expectedUrl'."
            }
          }

          if ($errors.Count -gt 0) {
            if ($candidate) {
              $errors | ForEach-Object { Write-Host "::warning::$_" }
              Write-Host "::warning::Version fields do not match release candidate tag '$tag'. Continuing because this is a draft release."
            } else {
              $errors | ForEach-Object { Write-Host "::error::$_" }
              Write-Error "Version mismatch for tag '$tag'. Bump every version field in info.json and repository.json (including the version inside DownloadUrl) before tagging."
              exit 1
            }
          } else {
            Write-Host "Releasing version $tag"
          }

      - name: Build and package
        run: dotnet build CustomDemonstrators.sln -c Release

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ghArgs = @(
            'release', 'create', '${{ github.ref_name }}', 'dist/CustomDemonstrators.zip',
            '--title', '${{ github.ref_name }}', '--generate-notes'
          )
          if ('${{ steps.tag.outputs.candidate }}' -eq 'true') {
            $ghArgs += '--draft'
            $ghArgs += '--prerelease'
          }
          gh @ghArgs
