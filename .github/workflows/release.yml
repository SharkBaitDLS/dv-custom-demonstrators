name: Release

on:
  push:
    tags:
      - '*'

permissions:
  actions: read
  contents: write

jobs:
  release:
    runs-on: [self-hosted, Windows]

    env:
      ReferencePath: 'C:\Program Files (x86)\Steam\steamapps\common\Derail Valley\DerailValley_Data\Managed\'

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          lfs: true

      - name: Require passing CI on this commit
        shell: powershell
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ github.sha }}'
          $appearBy = (Get-Date).AddMinutes(2)
          while ($true) {
            $json = gh run list --workflow ci.yml --commit $sha --event push --limit 1 --json databaseId,url
            if ($LASTEXITCODE -ne 0) { throw 'Failed to query CI runs.' }
            $run = @($json -join "`n" | ConvertFrom-Json) | Select-Object -First 1
            if ($run) { break }
            if ((Get-Date) -gt $appearBy) { throw "No CI run found for $sha. Was it pushed to main?" }
            Write-Host 'Waiting for the CI run to appear...'
            Start-Sleep -Seconds 10
          }
          Write-Host "Waiting on CI: $($run.url)"
          gh run watch $run.databaseId --exit-status --compact --interval 15
          if ($LASTEXITCODE -ne 0) { throw "CI did not pass for $sha`: $($run.url)" }

      - name: Pull LFS files
        run: git lfs pull

      - name: Classify tag
        id: tag
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = '${{ github.ref_name }}'
          if ($tag -match '^[0-9]+\.[0-9]+\.[0-9]+$') {
            Write-Host "Tag '$tag' is a full release."
            "candidate=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            Write-Host "Tag '$tag' is a release candidate."
            "candidate=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Verify tag matches a valid manifest entry
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $params = @{ Tag = '${{ github.ref_name }}' }
          if ('${{ steps.tag.outputs.candidate }}' -eq 'true') {
            $params.WarnOnly = $true
          }
          ./validate-manifests.ps1 @params

      - name: Build and package debug version
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build CustomDemonstrators.sln -c Debug
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          ./package.ps1 -ArchiveSuffix 'Debug'

      - name: Build and package release version
        run: dotnet build CustomDemonstrators.sln -c Release

      - name: Create GitHub release
        shell: powershell
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ghArgs = @(
            'release', 'create', '${{ github.ref_name }}',
            'dist/CustomDemonstrators.zip', 'dist/CustomDemonstratorsDebug.zip',
            '--title', '${{ github.ref_name }}', '--generate-notes'
          )
          if ('${{ steps.tag.outputs.candidate }}' -eq 'true') {
            $ghArgs += '--draft'
            $ghArgs += '--prerelease'
          }
          gh @ghArgs
